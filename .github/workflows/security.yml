name: Security Audit

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: Auditoría de dependencias y filesystem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Dependencias de Tauri y SQLCipher
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config libssl-dev libdbus-1-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: security-audit

      - name: Instalar herramientas de auditoría
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version
          sudo apt-get install -y ripgrep

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Auditoría
        run: ./security/audit.sh

      - name: Informe de trivy
        if: always()
        continue-on-error: true
        run: trivy fs --severity HIGH,CRITICAL --ignore-unfixed --format sarif --output security-audit.sarif . || true

      - name: Subir informe SARIF
        if: always() && hashFiles('security-audit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: security-audit.sarif
          category: security-audit
