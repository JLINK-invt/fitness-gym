[workspace]
resolver = "2"
members = [
  "apps/gym-desktop/src-tauri",
  "crates/gym-contracts",
  "crates/gym-core",
  "crates/gym-data",
  "crates/gym-sync",
  "crates/gym-backup",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
argon2 = "0.5.3"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4", features = ["serde"] }
gym-backup = { path = "crates/gym-backup" }
gym-contracts = { path = "crates/gym-contracts" }
gym-core = { path = "crates/gym-core" }
gym-data = { path = "crates/gym-data" }
gym-sync = { path = "crates/gym-sync" }
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
