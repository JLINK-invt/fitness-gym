[workspace]
resolver = "2"
members = [
  "apps/gym-desktop/src-tauri",
  "crates/gym-contracts",
  "crates/gym-core",
  "crates/gym-data",
  "crates/gym-sync",
  "crates/gym-sync-server",
  "crates/gym-backup",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
argon2 = "0.5.3"
axum = "0.8"
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4", features = ["serde"] }
gym-backup = { path = "crates/gym-backup" }
gym-contracts = { path = "crates/gym-contracts" }
gym-core = { path = "crates/gym-core" }
gym-data = { path = "crates/gym-data" }
gym-sync = { path = "crates/gym-sync" }
gym-sync-server = { path = "crates/gym-sync-server" }
hex = "0.4"
http-body-util = "0.1"
hmac = "0.12"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "charset",
  "http2",
  "json",
  "rustls-tls-manual-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
  "logging",
  "ring",
  "std",
  "tls12",
] }
rustls-pemfile = "2"
rustls-pki-types = "1"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "logging",
  "ring",
  "tls12",
] }
tower = { version = "0.5", features = ["util"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = "0.16"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
